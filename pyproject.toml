[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Multi-Agent PR Review Bot powered by E2B Sandbox"
requires-python = ">=3.12"
dependencies = [
    "e2b>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "PyGithub>=2.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]
