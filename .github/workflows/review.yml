name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      language:
        description: "Override review language profile"
        type: choice
        options:
          - auto
          - python
          - javascript
          - go
        default: auto

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip review on closed PRs that are not merged (only cleanup sandbox)
    if: github.event.action != 'closed' || github.event.pull_request.merged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Debug API connectivity
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "OPENAI_API_KEY set: $([ -n "$OPENAI_API_KEY" ] && echo "YES (${#OPENAI_API_KEY} chars, starts with ${OPENAI_API_KEY:0:10}...)" || echo "NO")"
          curl -s -w "\nHTTP: %{http_code}\n" https://code.newcli.com/codex/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "content-type: application/json" \
            -d '{"model":"gpt-5-codex","max_tokens":10,"stream":false,"messages":[{"role":"user","content":"hi"}]}' | head -c 500

      - name: Run PR Review Agent
        run: python -m pr_review_agent
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          LANGUAGE_OVERRIDE: ${{ github.event.inputs.language || '' }}
